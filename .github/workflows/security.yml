name: Security

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code:
    name: Code scan (Bandit)
    runs-on: ubuntu-latest
    continue-on-error: false       # blocking: today's B105 finding was Low severity but trivial to fix
                                    # (move the secret to env); blocking keeps new hardcoded-secret-shaped
                                    # findings from landing again now that the fix pattern is established
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: python -m pip install --upgrade bandit
      - name: Run bandit
        run: bandit -r . -f screen

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2

  image:
    name: Image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t campus-notifier:dev .
      - name: Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: campus-notifier:dev
          severity: CRITICAL
          exit-code: "1"            # blocking: CRITICAL with a published fix fails the build
          format: table

  iac:
    name: IaC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: false          # blocking: Terraform that opens something to the internet fails
                                     # the build; the one accepted-risk finding (CKV_AWS_136) is suppressed
                                     # inline in terraform/main.tf with its justification
