name: Security

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code:
    name: Code scan (Bandit)
    runs-on: ubuntu-latest
    continue-on-error: true        # warn for now; Drill 5 sets the threshold
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: python -m pip install --upgrade bandit
      - name: Run bandit
        run: bandit -r . -f screen

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t campus-notifier:dev .
      - name: Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: campus-notifier:dev
          severity: CRITICAL
          exit-code: "1"            # block on CRITICAL with a fix published
          format: table
  iac:
    name: IaC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: false          # block on IaC failures; accepted risks are suppressed with justifications