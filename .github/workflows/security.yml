name: Security

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code:
    name: Code scan (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: python -m pip install --upgrade bandit
      - name: Report all findings
        run: bandit -r . -f screen --exit-zero # Low: warn only
      - name: Gate on MEDIUM and above
        run: bandit -r . -ll

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # action lists the PR's commits
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, not just the PR head
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # required on pull_request events

  image:
    name: Image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t campus-notifier:dev .
      - name: Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: campus-notifier:dev
          severity: CRITICAL
          ignore-unfixed: true # policy: block only CRITICAL with a published fix
          exit-code: "1"
          format: table

  iac:
    name: IaC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: false
